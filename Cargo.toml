[package]
name = "datafusion-distributed-iceberg"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.0"
description = "Native Apache Iceberg tables for DataFusion and DataFusion Distributed"
license = "Apache-2.0"
repository = "https://github.com/alexanderbianchi/datafusion-iceberg"

[workspace]

[workspace.dependencies]
datafusion = { version = "55.0.0", default-features = false }
datafusion-proto = { version = "55.0.0", default-features = false }

[dependencies]
async-trait = "0.1"
async-stream = "0.3"
arrow-array-58 = { package = "arrow-array", version = "58" }
arrow-ipc-58 = { package = "arrow-ipc", version = "58" }
arrow-ipc-59 = { package = "arrow-ipc", version = "59" }
bytes = "1"
datafusion = { workspace = true, features = ["sql"] }
datafusion-proto = { workspace = true }
futures = "0.3"
iceberg = "0.10.1"
iceberg-storage-opendal = { version = "0.10.1", default-features = false, features = ["opendal-fs", "opendal-s3", "opendal-gcs"] }
object_store = "0.13"
parquet = "59"
parquet-58 = { package = "parquet", version = "58" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
typetag = "0.2"
datafusion-distributed = { version = "4.0.0", features = ["sql"] }
delegate = "0.13"
prost = "0.14.1"
tokio = { version = "1.48", features = ["full"] }
tokio-stream = "0.1"
url = "2"
uuid = { version = "1", features = ["v7"] }

[dev-dependencies]
datafusion-distributed = { version = "4.0.0", features = ["integration"] }
insta = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[workspace.lints.clippy]
disallowed_types = "deny"
disallowed-methods = "deny"
